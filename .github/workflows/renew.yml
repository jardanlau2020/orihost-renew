name: Orihost 自动续期

on:
  schedule:
    # 每 3 天 01:07 UTC（北京 09:07），避开整点高峰；与上游同节奏
    - cron: "7 1 */3 * *"
  workflow_dispatch:
    inputs:
      no_proxy:
        description: '跳过家宽出口，直连跑（排查用）'
        type: boolean
        default: false

concurrency:
  group: orihost-renew
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  MIHOMO_VERSION: "1.19.25"

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 🛠️ 安装依赖（seleniumbase + xvfb）
        run: |
          pip install -r requirements.txt
          sudo apt-get update -y
          # SeleniumBase 的 uc 模式用 headless=False + 外部 Xvfb，缺 Xvfb 或图形库
          # 就会「driver 连接 localhost:port 被拒」，所以这里一次装齐。
          # 注意：xvfb-run 不是独立 apt 包，它随 xvfb 一起装（run #78 踩过：
          # E: Unable to locate package xvfb-run）。
          sudo apt-get install -y xvfb x11-utils libgbm1 libasound2t64 fonts-noto-cjk
          # 不许静默失败：run #73 这步日志是空的，Xvfb 到底装没装没人知道
          which Xvfb || { echo "❌ Xvfb 没装上"; exit 1; }
          which xvfb-run || { echo "❌ xvfb-run 没装上"; exit 1; }
          Xvfb -help 2>&1 | head -2

      - name: 🔎 环境自检
        # run #73 卡在 localhost:43457 connection refused，跑了 332 秒才超时。
        # 先把 Xvfb / xvfb-run / chrome / seleniumbase 的存在打出来，起不来立刻失败。
        run: |
          set -e
          echo "--- Xvfb ---"; command -v Xvfb || { echo "❌ 缺 Xvfb"; exit 1; }
          echo "--- xvfb-run ---"; command -v xvfb-run || { echo "❌ 缺 xvfb-run"; exit 1; }
          echo "--- chrome ---"; (google-chrome --version || chromium --version || echo "（暂无 chrome，SB 会自行安装）")
          echo "--- seleniumbase ---"; python -c "import seleniumbase; print('seleniumbase', seleniumbase.__version__)"

      # ── 家宽出口（mihomo / Clash Meta）──────────────────────────────
      # Orihost 会记录续期来源 IP，GHA 机房 IP 属于按 IP 风控的典型特征，
      # 所以优先走住宅出口；没配 HOME_SUB_URL 才回落到 NODE_LINK（sing-box）。
      - name: 🏠 启动家宽出口（mihomo）
        id: homeproxy
        if: ${{ !inputs.no_proxy }}
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
          HOME_SUB_GZ: ${{ secrets.HOME_SUB_GZ }}
        run: |
          set -euo pipefail
          HAVE_URL=0; [ -n "${HOME_SUB_URL:-}" ] && HAVE_URL=1
          HAVE_GZ=0;  [ -n "${HOME_SUB_GZ:-}" ]  && HAVE_GZ=1
          if [ "$HAVE_URL" = 0 ] && [ "$HAVE_GZ" = 0 ]; then
            echo "⚪ 未配置 HOME_SUB_URL / HOME_SUB_GZ，跳过家宽出口"
            exit 0
          fi

          echo "⬇️ 下载 mihomo ${MIHOMO_VERSION}"
          curl -fsSL --retry 3 -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          gunzip -f /tmp/mihomo.gz
          mv /tmp/mihomo ./mihomo-bin
          chmod +x ./mihomo-bin

          echo "📥 生成配置"
          mkdir -p ./mihomo-home
          # 优先 HOME_SUB_GZ：它来自本地 home_sub.yaml（2633 行全 vless，无坏节点）。
          # HOME_SUB_URL 拉下来的那份含 ss 节点且 tls-crypt 为空，mihomo 会
          # "Parse config error: proxy 63: '' has unset fields: tls-crypt" 直接挂。
          if [ "$HAVE_GZ" = 1 ]; then
            echo "📦 用 HOME_SUB_GZ 还原配置（首选）"
            echo "$HOME_SUB_GZ" | base64 -d | gunzip > ./mihomo-home/config.yaml
          elif [ "$HAVE_URL" = 1 ] && curl -fsSL --retry 2 --max-time 30 -o ./mihomo-home/config.yaml "$HOME_SUB_URL"; then
            echo "✅ 订阅地址可用（fallback）"
          else
            echo "❌ 无可用配置来源"
            exit 1
          fi
          # 清理会让 mihomo 解析失败的空字段（ss 节点的 tls-crypt / 空密码等）
          sed -i -E "/^[[:space:]]*tls-crypt:[[:space:]]*('{2}|\"{2})?[[:space:]]*$/d" ./mihomo-home/config.yaml
          echo "--- config.yaml 前 3 行 ---"; head -3 ./mihomo-home/config.yaml
          echo "--- proxies 数量 ---"; grep -c "^  - name:" ./mihomo-home/config.yaml || true

          nohup ./mihomo-bin -d ./mihomo-home -f ./mihomo-home/config.yaml > mihomo.log 2>&1 &
          echo "MIHOMO_PID=$!" >> "$GITHUB_ENV"
          sleep 8

          if ! ss -tuln | grep -q ':7890'; then
            echo "❌ mihomo 没起来，日志如下"
            cat mihomo.log || true
            exit 1
          fi

          DIRECT_IP="$(curl -s --max-time 8 https://api.ipify.org || echo '')"
          PROXY_IP="$(curl -s --max-time 20 -x http://127.0.0.1:7890 https://api.ipify.org || echo '')"
          echo "📡 直连出口 IP: ${DIRECT_IP:-未知}"
          echo "📡 家宽出口 IP: ${PROXY_IP:-未知}"

          if [ -z "$PROXY_IP" ]; then
            echo "❌ 家宽出口不通，直接失败退出（不白跑）"
            exit 1
          fi
          if [ "$PROXY_IP" = "$DIRECT_IP" ]; then
            echo "❌ 出口 IP 与直连相同，代理没生效，直接失败退出"
            exit 1
          fi

          echo "✅ 家宽出口就绪：$PROXY_IP"
          echo "NODE_PROXY_URL=http://127.0.0.1:7890" >> "$GITHUB_ENV"
          echo "NODE_PROXY_IP=$PROXY_IP" >> "$GITHUB_ENV"

      - name: 🔄 运行续期
        env:
          ORIHOST_EMAIL: ${{ secrets.ORIHOST_EMAIL }}
          ORIHOST_PASSWORD: ${{ secrets.ORIHOST_PASSWORD }}
          ORIHOST_COOKIE: ${{ secrets.ORIHOST_COOKIE }}
          ORIHOST_REMEMBER: ${{ secrets.ORIHOST_REMEMBER }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          which Xvfb || { echo "❌ Xvfb 没装上"; exit 1; }
          which xvfb-run || { echo "❌ xvfb-run 没装上"; exit 1; }
          echo "DISPLAY 由 xvfb-run 提供"
          # 硬上限 300 秒：run #73 跑满 332 秒才发现 driver 起不来，不烧 CI。
          # 注意 tee 会吞掉退出码，所以取 PIPESTATUS。
          timeout 300 xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python orihost_renew.py 2>&1 | tee raw.log
          rc=${PIPESTATUS[0]}
          echo "python exit code: $rc"
          exit $rc

      - name: 💾 回写 ORIHOST_COOKIE
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ROTATE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then echo "未配置 GH_ROTATE_TOKEN，跳过 cookie 回写"; exit 0; fi
          if [ ! -s cookie.txt ]; then echo "没有导出的 cookie，跳过"; exit 0; fi
          gh secret set ORIHOST_COOKIE --repo "$GITHUB_REPOSITORY" < cookie.txt && echo "ORIHOST_COOKIE 已更新"
          rm -f cookie.txt

      - name: 🧽 收工清理
        if: always()
        run: |
          if [ -n "${MIHOMO_PID:-}" ] && kill -0 "$MIHOMO_PID" 2>/dev/null; then
            kill "$MIHOMO_PID" 2>/dev/null || true
            echo "mihomo 已停止"
          fi
          pkill -f chrome || true
          pkill -f Xvfb || true

      - name: 🖼️ 上传日志与截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orihost-run
          path: |
            run.log
            raw.log
            fail_*.png
            mihomo.log
          if-no-files-found: ignore
          retention-days: 7
