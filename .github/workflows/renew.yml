name: Orihost 自动续期

on:
  schedule:
    # 每 3 天 01:07 UTC（北京 09:07），避开整点高峰；与上游同节奏
    - cron: "7 1 */3 * *"
  workflow_dispatch:
    inputs:
      no_proxy:
        description: '跳过家宽出口，直连跑（排查用）'
        type: boolean
        default: false

concurrency:
  group: orihost-renew
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  MIHOMO_VERSION: "1.19.25"

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 🛠️ 安装依赖（seleniumbase + xvfb）
        run: |
          pip install -r requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y xvfb

      # ── 家宽出口（mihomo / Clash Meta）──────────────────────────────
      # Orihost 会记录续期来源 IP，GHA 机房 IP 属于按 IP 风控的典型特征，
      # 所以优先走住宅出口；没配 HOME_SUB_URL 才回落到 NODE_LINK（sing-box）。
      - name: 🏠 启动家宽出口（mihomo）
        id: homeproxy
        if: ${{ !inputs.no_proxy }}
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOME_SUB_URL:-}" ]; then
            echo "⚪ 未配置 HOME_SUB_URL，跳过家宽出口"
            exit 0
          fi

          echo "⬇️ 下载 mihomo ${MIHOMO_VERSION}"
          curl -fsSL --retry 3 -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          gunzip -f /tmp/mihomo.gz
          mv /tmp/mihomo ./mihomo-bin
          chmod +x ./mihomo-bin

          echo "📥 拉订阅并生成配置"
          mkdir -p ./mihomo-home
          curl -fsSL --retry 3 -o ./mihomo-home/config.yaml "$HOME_SUB_URL"

          nohup ./mihomo-bin -d ./mihomo-home -f ./mihomo-home/config.yaml > mihomo.log 2>&1 &
          echo "MIHOMO_PID=$!" >> "$GITHUB_ENV"
          sleep 8

          if ! ss -tuln | grep -q ':7890'; then
            echo "❌ mihomo 没起来，日志如下"
            cat mihomo.log || true
            exit 1
          fi

          DIRECT_IP="$(curl -s --max-time 8 https://api.ipify.org || echo '')"
          PROXY_IP="$(curl -s --max-time 20 -x http://127.0.0.1:7890 https://api.ipify.org || echo '')"
          echo "📡 直连出口 IP: ${DIRECT_IP:-未知}"
          echo "📡 家宽出口 IP: ${PROXY_IP:-未知}"

          if [ -z "$PROXY_IP" ]; then
            echo "❌ 家宽出口不通，直接失败退出（不白跑）"
            exit 1
          fi
          if [ "$PROXY_IP" = "$DIRECT_IP" ]; then
            echo "❌ 出口 IP 与直连相同，代理没生效，直接失败退出"
            exit 1
          fi

          echo "✅ 家宽出口就绪：$PROXY_IP"
          echo "NODE_PROXY_URL=http://127.0.0.1:7890" >> "$GITHUB_ENV"
          echo "NODE_PROXY_IP=$PROXY_IP" >> "$GITHUB_ENV"

      - name: 🔄 运行续期
        env:
          ORIHOST_EMAIL: ${{ secrets.ORIHOST_EMAIL }}
          ORIHOST_PASSWORD: ${{ secrets.ORIHOST_PASSWORD }}
          ORIHOST_COOKIE: ${{ secrets.ORIHOST_COOKIE }}
          ORIHOST_REMEMBER: ${{ secrets.ORIHOST_REMEMBER }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          python orihost_renew.py 2>&1 | tee raw.log

      - name: 💾 回写 ORIHOST_COOKIE
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ROTATE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then echo "未配置 GH_ROTATE_TOKEN，跳过 cookie 回写"; exit 0; fi
          if [ ! -s cookie.txt ]; then echo "没有导出的 cookie，跳过"; exit 0; fi
          gh secret set ORIHOST_COOKIE --repo "$GITHUB_REPOSITORY" < cookie.txt && echo "ORIHOST_COOKIE 已更新"
          rm -f cookie.txt

      - name: 🧽 收工清理
        if: always()
        run: |
          if [ -n "${MIHOMO_PID:-}" ] && kill -0 "$MIHOMO_PID" 2>/dev/null; then
            kill "$MIHOMO_PID" 2>/dev/null || true
            echo "mihomo 已停止"
          fi
          pkill -f chrome || true
          pkill -f Xvfb || true

      - name: 🖼️ 上传日志与截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orihost-run
          path: |
            run.log
            raw.log
            fail_*.png
            mihomo.log
          if-no-files-found: ignore
          retention-days: 7
