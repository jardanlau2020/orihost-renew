name: 家宽出口自测（openvpn）

# 只为验证 scripts/openvpn_egress.py 在 GHA runner 上真能开隧道、真能换出口 IP。
# 不碰续期、不碰面板、不写任何 secret。手动 dispatch 才跑。
#
# 为什么单独一个 workflow：renew.yml 正在 PR #5 里改，这里再动它会冲突。
# 等 #5 合并后，把「起隧道 → 验 IP」这两步并进 renew.yml 即可，
# 逻辑就是下面这几段，直接搬。

on:
  # 改动这三个文件时自动跑：自测本身就是为了证明它们在真 runner 上能用。
  # 用 paths 过滤而不是硬写分支名，PR 分支上也能触发（workflow_dispatch 只认
  # 默认分支上的文件，PR 分支上没法手动 dispatch）。
  push:
    paths:
      - '.github/workflows/egress-selftest.yml'
      - 'scripts/openvpn_egress.py'
      - 'scripts/filter_mihomo.py'
  workflow_dispatch:
    inputs:
      config_source:
        description: '订阅来源：gz（默认，可能是过滤后的 63 节点）/ url（原始 132 节点，验 openvpn 用这个）'
        required: false
        default: 'gz'
        type: choice
        options:
          - gz
          - url
      region:
        description: '地区关键字（KR / JP / MY），留空则取第一个可用节点'
        required: false
        default: 'KR'
        type: string

permissions:
  contents: read

jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装 openvpn + PyYAML
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openvpn iproute2 curl
          which openvpn || { echo "❌ openvpn 没装上"; exit 1; }
          openvpn --version | head -1
          pip install --quiet pyyaml
          python -c "import yaml; print('pyyaml', yaml.__version__)"

      - name: 还原订阅配置
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
          HOME_SUB_GZ: ${{ secrets.HOME_SUB_GZ }}
          SOURCE: ${{ inputs.config_source }}
        run: |
          set -euo pipefail
          # HOME_SUB_GZ 现在装的是「只留 vless/trojan」的过滤版（63 节点），
          # 里面没有 openvpn 住宅节点，验 openvpn 必须用原始订阅（url）。
          if [ "${SOURCE:-gz}" = "url" ]; then
            if [ -z "${HOME_SUB_URL:-}" ]; then
              echo "❌ config_source=url 但没有 HOME_SUB_URL"; exit 1
            fi
            echo "🌐 用 HOME_SUB_URL（原始订阅）"
            curl -fsSL --retry 2 --max-time 30 -o home_sub.yaml "$HOME_SUB_URL"
          elif [ -n "${HOME_SUB_GZ:-}" ]; then
            echo "📦 用 HOME_SUB_GZ 还原（注意：可能是过滤后的 63 节点版）"
            echo "$HOME_SUB_GZ" | base64 -d | gunzip > home_sub.yaml
          elif [ -n "${HOME_SUB_URL:-}" ]; then
            curl -fsSL --retry 2 --max-time 30 -o home_sub.yaml "$HOME_SUB_URL"
          else
            echo "⚪ 既无 HOME_SUB_GZ 也无 HOME_SUB_URL，无法自测"
            exit 1
          fi
          python - <<'PY'
          import yaml, collections
          d = yaml.safe_load(open('home_sub.yaml', encoding='utf-8'))
          px = d.get('proxies') or []
          print('节点总数:', len(px))
          print('类型分布:', dict(collections.Counter(p.get('type') for p in px)))
          ov = [p for p in px if p.get('type') == 'openvpn']
          print('openvpn 住宅节点:', len(ov))
          PY

      - name: filter_mihomo.py 预检（只报告，不写文件）
        run: |
          set -uo pipefail
          # 用 --check：绝不改写订阅文件。
          # 退出码语义（脚本定义）：
          #   0 = 可用（可能丢了非住宅节点）
          #   1 = 致命（YAML 坏 / 一个节点都不剩）
          #   2 = 能解析，但住宅节点全丢 —— 对 mihomo 而言等于没有家宽
          python scripts/filter_mihomo.py --check home_sub.yaml; rc=$?
          echo "filter 退出码 = $rc"
          case "$rc" in
            0) echo "ℹ️ 住宅节点未被丢弃（这份配置 mihomo 可能能吃）" ;;
            2) echo "✅ 符合预期：住宅节点是 openvpn，mihomo 解析不了 → 该走 openvpn 直连" ;;
            *) echo "❌ filter 致命错误（rc=$rc）"; exit 1 ;;
          esac

      - name: 列出可用住宅节点（为 0 则明确「无法验证」）
        run: |
          set -uo pipefail
          python scripts/openvpn_egress.py --config home_sub.yaml --list | tee /tmp/ovpn_list.txt
          N=$(grep -c '^\[ovpn\]   ' /tmp/ovpn_list.txt || true)
          echo "可用住宅节点数 = $N"
          if [ "$N" = "0" ]; then
            echo "⚠️ 这份配置里没有 openvpn 住宅节点，openvpn 路径无法验证。"
            echo "⚠️ 常见原因：HOME_SUB_GZ 已被替换成「只留 vless/trojan」的过滤版（63 节点）。"
            echo "⚠️ 要真验 openvpn，请改用含 69 个 openvpn 的原始订阅（config_source=url）。"
            echo "SKIP_OPENVPN=1" >> "$GITHUB_ENV"
          fi

      - name: 起 openvpn 隧道并验证出口 IP
        if: ${{ env.SKIP_OPENVPN != '1' }}
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          DIRECT_IP="$(curl -s --max-time 10 https://api.ipify.org || true)"
          echo "📡 直连出口 IP: ${DIRECT_IP:-未知}"

          python scripts/openvpn_egress.py --config home_sub.yaml \
            ${REGION:+--region "$REGION"} --out /tmp/node.ovpn

          # 强制接管默认路由：没有这行，curl 还是走原网卡，会误判节点失败
          echo 'redirect-gateway def1' >> /tmp/node.ovpn
          sudo openvpn --config /tmp/node.ovpn --daemon --log /tmp/ovpn.log

          for i in $(seq 1 20); do
            sleep 3
            TUN_IF="$(ip -o link show | awk -F': ' '/ tun/{print $2; exit}')"
            if [ -n "$TUN_IF" ]; then
              PROXY_IP="$(curl -s --interface "$TUN_IF" --max-time 8 https://api.ipify.org || true)"
              [ -n "$PROXY_IP" ] && break
            fi
          done
          echo "📡 tun 接口: ${TUN_IF:-无}"
          echo "📡 隧道出口 IP: ${PROXY_IP:-未知}"
          echo "--- openvpn 日志尾部 ---"
          sudo tail -20 /tmp/ovpn.log || true

          if [ -z "${TUN_IF:-}" ]; then
            echo "❌ 没有 tun 接口，隧道没建立"; exit 1
          fi
          if [ -z "${PROXY_IP:-}" ]; then
            echo "❌ 隧道接口拿不到出口 IP"; exit 1
          fi
          if [ "$PROXY_IP" = "$DIRECT_IP" ]; then
            echo "❌ 出口 IP 与直连相同，隧道没生效"; exit 1
          fi
          echo "✅ openvpn 住宅出口可用：$DIRECT_IP → $PROXY_IP"

      - name: 收隧道
        if: always()
        run: |
          sudo pkill -f 'openvpn --config /tmp/node.ovpn' || true
          rm -f /tmp/node.ovpn /tmp/orihost-ovpn-auth-*.txt
          echo "隧道已收"
